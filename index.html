<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="YA Explorer">
  <title>YA Explorer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">🔨</div>
      <div><h1>YA Explorer</h1><p>Yahoo!オークション情報取得</p></div>
    </header>

    <section class="card">
      <label for="auctionUrl">Yahoo!オークションの商品ID</label>
      <div class="input-row">
        <input id="auctionUrl" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="例：g1245260346">
        <button id="pasteButton" class="sub" type="button">貼り付け</button>
      </div>
      <button id="runButton" class="primary" type="button">JSONを取得してコピー</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="resultCard" class="card result-card" hidden>
      <div class="result-head"><h2>取得結果</h2><button id="copyButton" class="sub" type="button">コピー</button></div>
      <textarea id="result" readonly spellcheck="false"></textarea>
    </section>

    <section id="setupCard" class="card setup-card">
      <details>
        <summary>初回設定</summary>
        <label for="apiUrl">YA Explorer用 Apps Script URL</label>
        <input id="apiUrl" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec">
        <button id="saveButton" class="sub wide" type="button">URLを保存</button>
        <p>同梱の <strong>Code_YA_Explorer_PWA.gs</strong> を別のApps Scriptとして公開し、そのウェブアプリURLを保存してください。</p>
      </details>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
